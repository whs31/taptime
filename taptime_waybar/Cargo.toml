[package]
name = "taptime_waybar"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "taptime-waybar"
path = "src/main.rs"

[[bin]]
name = "taptime-notifier"
path = "src/bin/notifier.rs"

[dependencies]
taptime_client = { path = "../taptime_client", default-features = false }
chrono = "0.4"
notify-rust = "4"
tokio = { version = "1", features = ["rt", "macros", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
