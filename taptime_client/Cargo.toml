[package]
name = "taptime_client"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
taptime_core = { path = "../taptime_core" }
taptime_schema = { path = "../taptime_schema", features = ["grpc"] }
chrono = "0.4"
chrono-tz = "0.10"
prost = "0.14"
prost-types = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time", "sync"] }
serde_json = "1"
libc = "0.2"

[[bin]]
name = "taptime"
path = "src/main.rs"

[[bin]]
name = "taptime-daemon"
path = "src/bin/daemon.rs"
